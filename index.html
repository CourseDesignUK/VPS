<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Tactical Field Client - VPS Node</title>
<style>
:root {
  --bg: #07090c;
  --panel: rgba(14, 18, 24, 0.92);
  --border: rgba(64, 82, 105, 0.4);
  --accent: #00d0ff;
  --text: #e6edf3;
  --muted: #8b9bb0;
  --ok: #00ff88;
  --warn: #ffb84d;
  --err: #ff4d4d;
  --mono: "SF Mono", "Fira Code", monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: var(--sans); overflow: hidden; height: 100vh; }
#viewport { position: absolute; inset: 0; }
video { width: 100%; height: 100%; object-fit: cover; display: block; }
canvas#hudOverlay { position: absolute; inset: 0; pointer-events: none; width: 100%; height: 100%; }
#ui { position: absolute; inset: 0; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 16px; }
.top-bar { display: flex; justify-content: space-between; align-items: center; }
.badge { background: var(--panel); border: 1px solid var(--border); padding: 6px 12px; border-radius: 4px; font-size: 11px; font-family: var(--mono); font-weight: 700; }
.hud-panel { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 14px; width: 310px; backdrop-filter: blur(10px); }
.hud-title { font-size: 10px; text-transform: uppercase; color: var(--muted); letter-spacing: .06em; margin-bottom: 6px; font-family: var(--mono); }
.metric { font-family: var(--mono); font-size: 12px; margin-bottom: 4px; display: flex; justify-content: space-between; }
.metric span { color: var(--accent); }
.controls { pointer-events: auto; display: flex; flex-direction: column; gap: 8px; }
button { background: #18202a; border: 1px solid var(--border); color: var(--text); font-size: 12px; font-weight: 600; padding: 10px 14px; border-radius: 4px; cursor: pointer; }
button.primary { background: rgba(0, 208, 255, 0.15); border-color: var(--accent); color: var(--accent); }
input { background: #121820; border: 1px solid var(--border); color: #fff; padding: 8px; border-radius: 4px; font-family: var(--mono); font-size: 11px; }
</style>
</head>
<body>

<div id="viewport">
  <video id="vStream" playsinline muted autoplay></video>
  <canvas id="hudOverlay"></canvas>
</div>

<div id="ui">
  <div class="top-bar">
    <div class="badge" id="nodeCallsign" style="color:var(--accent);">NODE: INITIALIZING</div>
    <div class="badge" id="telemetryState" style="color:var(--warn);">LINK: OFFLINE</div>
  </div>

  <div class="hud-panel">
    <div class="hud-title">Local 6-DoF Metric Pose</div>
    <div class="metric">Metric Pose: <span id="posVec">0.00, 0.00, 0.00</span></div>
    <div class="metric">Heading: <span id="yawDeg">000.0°</span></div>
    <div class="metric">Anchor: <span id="activeAnchor">NONE</span></div>
    <div class="metric">Packets TX: <span id="txCount">0</span></div>
  </div>

  <div class="controls">
    <input type="text" id="wsHost" placeholder="ws://192.168.1.X:8080 (Leave blank for local bus)">
    <button id="btnStart" class="primary">Engage Sensor & Join Grid</button>
  </div>
</div>

<script>
const FACILITY_MAP = {
  anchors: [
    { id: "TAG_0", code: 0, x: 0.0, y: 0.0, z: 0.0, yaw: 0,   size: 0.16 },
    { id: "TAG_1", code: 1, x: 4.0, y: 0.0, z: 0.0, yaw: 90,  size: 0.16 },
    { id: "TAG_2", code: 2, x: 4.0, y: 0.0, z: 4.0, yaw: 180, size: 0.16 },
    { id: "TAG_3", code: 3, x: 0.0, y: 0.0, z: 4.0, yaw: 270, size: 0.16 }
  ]
};

// Generate or retrieve persistent callsign
const DEVICE_ID = localStorage.getItem("vps_node_id") || 
  ("NODE_" + Math.random().toString(36).substring(2, 6).toUpperCase());
localStorage.setItem("vps_node_id", DEVICE_ID);
document.getElementById("nodeCallsign").textContent = `ID: ${DEVICE_ID}`;

let rawPose = { x: 0, y: 0, z: 0, yaw: 0 };
let filteredPose = { x: 0, y: 0, z: 0, yaw: 0 };
let filterAlpha = 0.3;
let txCounter = 0;
let ws = null;
let broadcastChan = null;

const video = document.getElementById("vStream");
const hud = document.getElementById("hudOverlay");
const hctx = hud.getContext("2d");

const pCanvas = document.createElement("canvas");
const pctx = pCanvas.getContext("2d", { willReadFrequently: true });
const PROC_W = 320;
let PROC_H = 240;

function initTelemetryPipe() {
  broadcastChan = new BroadcastChannel("vps_telemetry_bus");
  const hostVal = document.getElementById("wsHost").value.trim();
  const wsTarget = hostVal || (location.protocol === "http:" ? `ws://${location.hostname}:8080` : null);

  if (wsTarget) {
    try {
      ws = new WebSocket(wsTarget);
      ws.onopen = () => {
        document.getElementById("telemetryState").textContent = "LINK: WS ACTIVE";
        document.getElementById("telemetryState").style.color = "var(--ok)";
      };
      ws.onerror = () => fallbackToBroadcast();
      ws.onclose = () => fallbackToBroadcast();
    } catch(e) {
      fallbackToBroadcast();
    }
  } else {
    fallbackToBroadcast();
  }
}

function fallbackToBroadcast() {
  document.getElementById("telemetryState").textContent = "LINK: LOCAL BUS";
  document.getElementById("telemetryState").style.color = "var(--accent)";
}

function sendTelemetry(pose, anchorId) {
  const payload = JSON.stringify({
    deviceId: DEVICE_ID,
    timestamp: Date.now(),
    pose: {
      x: Number(pose.x.toFixed(3)),
      y: Number(pose.y.toFixed(3)),
      z: Number(pose.z.toFixed(3)),
      yaw: Number(pose.yaw.toFixed(1))
    },
    lockedAnchor: anchorId
  });

  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(payload);
  }
  if (broadcastChan) {
    broadcastChan.postMessage(JSON.parse(payload));
  }

  txCounter++;
  document.getElementById("txCount").textContent = txCounter;
}

function decodePermutedTag(gray, w, h, quad) {
  const N = 6;
  let rawGrid = [];

  for (let r = 0; r < N; r++) {
    rawGrid[r] = [];
    for (let c = 0; c < N; c++) {
      const u = (c + 0.5) / N, v = (r + 0.5) / N;
      const xTop = quad[0].x + u * (quad[1].x - quad[0].x);
      const yTop = quad[0].y + u * (quad[1].y - quad[0].y);
      const xBot = quad[3].x + u * (quad[2].x - quad[3].x);
      const yBot = quad[3].y + u * (quad[2].y - quad[3].y);
      const px = Math.round(xTop + v * (xBot - xTop));
      const py = Math.round(yTop + v * (yBot - yTop));

      rawGrid[r][c] = (px >= 0 && px < w && py >= 0 && py < h) ? (gray[py * w + px] > 128 ? 1 : 0) : 0;
    }
  }

  let borders = 0;
  for (let i = 0; i < N; i++) {
    if (rawGrid[0][i] === 0) borders++;
    if (rawGrid[N - 1][i] === 0) borders++;
    if (rawGrid[i][0] === 0) borders++;
    if (rawGrid[i][N - 1] === 0) borders++;
  }
  if (borders < 16) return null;

  let inner = [];
  for (let r = 1; r <= 4; r++) {
    inner.push(rawGrid[r].slice(1, 5));
  }

  for (let rot = 0; rot < 4; rot++) {
    let bits = 0;
    for (let r = 0; r < 4; r++) {
      for (let c = 0; c < 4; c++) {
        bits = (bits << 1) | inner[r][c];
      }
    }
    const match = FACILITY_MAP.anchors.find(a => (bits % 4) === a.code || bits === a.code);
    if (match) return { anchor: match, rotIndex: rot };
    inner = inner[0].map((_, idx) => inner.map(row => row[idx]).reverse());
  }
  return null;
}

function solveRigidTransform(detection, quad) {
  const anchor = detection.anchor;
  const tagSize = anchor.size;
  const pxWidth = Math.hypot(quad[1].x - quad[0].x, quad[1].y - quad[0].y);
  const pxHeight = Math.hypot(quad[2].x - quad[1].x, quad[2].y - quad[1].y);
  const avgDim = (pxWidth + pxHeight) * 0.5;

  const focalPixels = PROC_W * 1.25;
  const distMetric = (focalPixels * tagSize) / avgDim;

  const quadCenterX = (quad[0].x + quad[1].x + quad[2].x + quad[3].x) * 0.25;
  const bearingRad = Math.atan2(quadCenterX - (PROC_W * 0.5), focalPixels);
  const bearingDeg = bearingRad * (180 / Math.PI);

  const worldAngleRad = ((anchor.yaw + bearingDeg) * Math.PI) / 180;
  rawPose.x = anchor.x + Math.sin(worldAngleRad) * distMetric;
  rawPose.y = anchor.y;
  rawPose.z = anchor.z + Math.cos(worldAngleRad) * distMetric;
  rawPose.yaw = (anchor.yaw + bearingDeg + 180) % 360;

  filteredPose.x = filteredPose.x === 0 ? rawPose.x : (filterAlpha * rawPose.x + (1 - filterAlpha) * filteredPose.x);
  filteredPose.y = filteredPose.y === 0 ? rawPose.y : (filterAlpha * rawPose.y + (1 - filterAlpha) * filteredPose.y);
  filteredPose.z = filteredPose.z === 0 ? rawPose.z : (filterAlpha * rawPose.z + (1 - filterAlpha) * filteredPose.z);
  filteredPose.yaw = rawPose.yaw;

  document.getElementById("posVec").textContent = 
    `${filteredPose.x.toFixed(2)}, ${filteredPose.y.toFixed(2)}, ${filteredPose.z.toFixed(2)}`;
  document.getElementById("yawDeg").textContent = 
    `${Math.round(filteredPose.yaw).toString().padStart(3, "0")}°`;
  document.getElementById("activeAnchor").textContent = anchor.id;

  sendTelemetry(filteredPose, anchor.id);
}

function processFrame() {
  if (video.readyState === video.HAVE_ENOUGH_DATA) {
    if (hud.width !== video.videoWidth || hud.height !== video.videoHeight) {
      hud.width = video.videoWidth;
      hud.height = video.videoHeight;
      PROC_H = Math.round((video.videoHeight / video.videoWidth) * PROC_W);
      pCanvas.width = PROC_W;
      pCanvas.height = PROC_H;
    }

    hctx.clearRect(0, 0, hud.width, hud.height);
    pctx.drawImage(video, 0, 0, PROC_W, PROC_H);

    const img = pctx.getImageData(0, 0, PROC_W, PROC_H);
    const d = img.data;
    const gray = new Uint8Array(PROC_W * PROC_H);
    for (let i = 0, j = 0; i < d.length; i += 4, j++) {
      gray[j] = (d[i] * 77 + d[i+1] * 150 + d[i+2] * 29) >> 8;
    }

    const bin = new Uint8Array(PROC_W * PROC_H);
    const S = PROC_W >> 3, s2 = S >> 1;
    const integral = new Int32Array(PROC_W * PROC_H);

    for (let i = 0; i < PROC_W; i++) {
      let sum = 0;
      for (let j = 0; j < PROC_H; j++) {
        const idx = j * PROC_W + i;
        sum += gray[idx];
        integral[idx] = (i === 0 ? 0 : integral[idx - 1]) + sum;
      }
    }

    for (let i = 0; i < PROC_W; i++) {
      for (let j = 0; j < PROC_H; j++) {
        const idx = j * PROC_W + i;
        const x1 = Math.max(i - s2, 1), x2 = Math.min(i + s2, PROC_W - 1);
        const y1 = Math.max(j - s2, 1), y2 = Math.min(j + s2, PROC_H - 1);
        const count = (x2 - x1) * (y2 - y1);
        const sum = integral[y2 * PROC_W + x2] - integral[y1 * PROC_W + x2] - integral[y2 * PROC_W + x1] + integral[y1 * PROC_W + x1];
        bin[idx] = (gray[idx] * count <= sum * 0.82) ? 0 : 255;
      }
    }

    const quads = findQuads(bin, PROC_W, PROC_H);
    quads.forEach(q => {
      const match = decodePermutedTag(gray, PROC_W, PROC_H, q);
      if (match) {
        solveRigidTransform(match, q);
        drawHUD(q, match.anchor.id);
      }
    });
  }
  requestAnimationFrame(processFrame);
}

function findQuads(bin, w, h) {
  const visited = new Uint8Array(w * h);
  const quads = [];
  for (let y = 6; y < h - 6; y += 4) {
    for (let x = 6; x < w - 6; x += 4) {
      const idx = y * w + x;
      if (bin[idx] === 0 && !visited[idx]) {
        const c = traceContour(bin, visited, w, h, x, y);
        if (c && c.length > 20 && c.length < 700) {
          const poly = approxPoly(c, 5.0);
          if (poly.length === 4) quads.push(poly);
        }
      }
    }
  }
  return quads;
}

function traceContour(bin, visited, w, h, sx, sy) {
  const pts = [];
  let cx = sx, cy = sy;
  const dx = [1, 1, 0, -1, -1, -1, 0, 1];
  const dy = [0, 1, 1, 1, 0, -1, -1, -1];
  let dir = 7;
  for (let step = 0; step < 700; step++) {
    pts.push({ x: cx, y: cy });
    visited[cy * w + cx] = 1;
    let found = false;
    for (let i = 0; i < 8; i++) {
      const nd = (dir + i) % 8;
      const nx = cx + dx[nd], ny = cy + dy[nd];
      if (nx >= 0 && nx < w && ny >= 0 && ny < h && bin[ny * w + nx] === 0) {
        cx = nx; cy = ny;
        dir = (nd + 5) % 8;
        found = true;
        break;
      }
    }
    if (!found || (cx === sx && cy === sy && pts.length > 4)) break;
  }
  return pts;
}

function approxPoly(pts, eps) {
  if (pts.length < 3) return pts;
  let dmax = 0, idx = 0;
  for (let i = 1; i < pts.length - 1; i++) {
    const d = distToLine(pts[i], pts[0], pts[pts.length - 1]);
    if (d > dmax) { idx = i; dmax = d; }
  }
  if (dmax > eps) {
    return approxPoly(pts.slice(0, idx + 1), eps).slice(0, -1).concat(approxPoly(pts.slice(idx), eps));
  }
  return [pts[0], pts[pts.length - 1]];
}

function distToLine(p, a, b) {
  const mag = Math.hypot(b.x - a.x, b.y - a.y);
  return mag === 0 ? Math.hypot(p.x - a.x, p.y - a.y) : Math.abs((b.y - a.y)*p.x - (b.x - a.x)*p.y + b.x*a.y - b.y*a.x) / mag;
}

function drawHUD(q, id) {
  const sx = hud.width / PROC_W;
  const sy = hud.height / PROC_H;
  hctx.strokeStyle = "#00d0ff";
  hctx.lineWidth = 2;
  hctx.beginPath();
  hctx.moveTo(q[0].x * sx, q[0].y * sy);
  hctx.lineTo(q[1].x * sx, q[1].y * sy);
  hctx.lineTo(q[2].x * sx, q[2].y * sy);
  hctx.lineTo(q[3].x * sx, q[3].y * sy);
  hctx.closePath();
  hctx.stroke();

  hctx.fillStyle = "rgba(0, 208, 255, 0.2)";
  hctx.fill();
  hctx.fillStyle = "#00d0ff";
  hctx.font = "bold 12px monospace";
  hctx.fillText(`LOC: ${id}`, q[0].x * sx, q[0].y * sy - 6);
}

document.getElementById("btnStart").onclick = async () => {
  try {
    initTelemetryPipe();
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } }
    });
    video.srcObject = stream;
    await video.play();
    document.querySelector(".controls").style.display = "none";
    requestAnimationFrame(processFrame);
  } catch (err) {
    alert("Sensor access error: " + err.message);
  }
};
</script>
</body>
</html>
